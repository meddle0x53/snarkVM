[package]
name = "load-from-store-profiler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "load-from-store-profiler"
path = "src/main.rs"

[dependencies.anyhow]
version = "1.0.91"

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "json"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.133"

[dependencies.snarkvm-console]
workspace = true

[dependencies.snarkvm-ledger]
workspace = true
features = ["rocks"]

[dependencies.snarkvm-parameters]
workspace = true
features = ["filesystem"]

[dependencies.snarkvm-synthesizer]
workspace = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "fs", "time"]

[dependencies.tracing]
version=  "0.1"

[dependencies.tracing-subscriber]
version=  "0.3"
features = ["fmt"]
